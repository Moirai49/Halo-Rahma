<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semangat Rahma!</title>
<style>
  :root { --bg:#e8f6ff; --ink:#0b4a6f; --accent:#ff9f1c; --yellow:#ffd60a; box-sizing:border-box; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b2a3d; --ink:#e8f6ff; } }
  :root[data-theme="dark"] { --bg:#0b2a3d; --ink:#e8f6ff; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Poppins","Trebuchet MS",system-ui,sans-serif; overflow:hidden; }
  .msg { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
         text-align:center; padding:24px; gap:14px; }
  .msg h1 { font-size:clamp(2rem,7vw,3.6rem); margin:0; line-height:1.15; }
  .msg h1 span { color:var(--accent); }
  .msg p { font-size:clamp(1rem,2.6vw,1.35rem); max-width:34em; margin:0; line-height:1.6; }
  .wave { font-size:3rem; animation:bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .btns { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:18px; }
  button.btn { font:inherit; font-weight:600; font-size:1.05rem; padding:12px 22px; border:0; border-radius:999px; cursor:pointer;
               background:var(--accent); color:#fff; transition:transform .15s; }
  button.btn:hover { transform:scale(1.06); }
  button.btn.alt { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); }
  .view { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; flex-direction:column; gap:20px;
          padding:24px; text-align:center; overflow:hidden; }
  .view.show { display:flex; }
  #flowers { background:linear-gradient(#ffe3ef,#d9f7d6); }
  #no { background:#000; color:#fff; }
  #no h2 { font-size:clamp(2rem,8vw,4rem); margin:0; }
  .fl { position:absolute; bottom:-60px; animation:rise linear forwards; }
  @keyframes rise { to { transform:translateY(-115vh) rotate(30deg); } }
  .bloom { position:absolute; animation:pop .6s ease-out both; }
  @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; transition:opacity .9s ease; }
  canvas.done { opacity:0; pointer-events:none; }
</style>
</head>
<body>
  <div class="msg">
    <h1>semangat yaa <span>Rahma</span> buat UTS renang besok!!</h1>
    <div class="btns">
      <button class="btn" id="yes">pasti semangat dong</button>
      <button class="btn alt" id="nope">nggak semangat ah</button>
    </div>
  </div>
  <div class="view" id="flowers"></div>
  <div class="view" id="no">
    <h2>hey no no yeah</h2>
    <button class="btn" id="ok">okedeh aku semangat</button>
  </div>
  <canvas id="c"></canvas>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var drawing = false, finished = false, last = null, moves = 0;

  function paint() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffd60a';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.fillStyle = '#7a5c00';
    ctx.font = '600 20px "Trebuchet MS",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Klik dan geser mouse-nya untuk membuka pesan ✨', innerWidth / 2, innerHeight / 2);
  }
  paint();
  addEventListener('resize', function () { if (!finished) paint(); });

  function pos(e) { return { x: e.clientX, y: e.clientY }; }
  function scratch(p) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(50, Math.min(innerWidth, innerHeight) * 0.09);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function cleared() {
    var w = canvas.width, h = canvas.height, step = 24, hit = 0, total = 0;
    var d = ctx.getImageData(0, 0, w, h).data;
    for (var y = 0; y < h; y += step) for (var x = 0; x < w; x += step) {
      total++; if (d[(y * w + x) * 4 + 3] < 40) hit++;
    }
    return hit / total;
  }
  canvas.addEventListener('pointerdown', function (e) {
    drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing'; scratch(last);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing || finished) return;
    scratch(pos(e));
    if (++moves % 12 === 0 && cleared() > 0.55) {
      finished = true; canvas.classList.add('done');
    }
  });
  function stop() { drawing = false; canvas.style.cursor = 'grab'; }
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
})();
</script>
<script>
(function () {
  var flowers = document.getElementById('flowers'), no = document.getElementById('no');
  var icons = ['🌸','🌷','🌻','🌼','🌹','💐','🌺'];
  function showFlowers() {
    no.classList.remove('show');
    flowers.classList.add('show');
    flowers.innerHTML = '';
    for (var i = 0; i < 28; i++) {
      var b = document.createElement('div');
      b.className = 'bloom';
      b.textContent = icons[i % icons.length];
      b.style.left = (Math.random() * 92) + '%';
      b.style.top = (Math.random() * 85) + '%';
      b.style.fontSize = (32 + Math.random() * 56) + 'px';
      b.style.animationDelay = (i * 0.07) + 's';
      flowers.appendChild(b);
    }
    for (var j = 0; j < 22; j++) {
      var f = document.createElement('div');
      f.className = 'fl';
      f.textContent = icons[j % icons.length];
      f.style.left = (Math.random() * 95) + '%';
      f.style.fontSize = (22 + Math.random() * 28) + 'px';
      f.style.animationDuration = (6 + Math.random() * 6) + 's';
      f.style.animationDelay = (Math.random() * 3) + 's';
      flowers.appendChild(f);
    }
  }
  document.getElementById('yes').onclick = showFlowers;
  document.getElementById('ok').onclick = showFlowers;
  document.getElementById('nope').onclick = function () { no.classList.add('show'); };
})();
</script>
</body>
</html>
